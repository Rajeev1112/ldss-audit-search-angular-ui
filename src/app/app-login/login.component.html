<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-mark">LDSS</div>
    <p class="eyebrow">Secure access</p>
    <h1 id="login-title">Audit Search</h1>
    <p class="login-intro">Sign in to search and review system activity.</p>

    <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
      <div class="field">
        <label for="role">User role</label>
        <select id="role" formControlName="role">
          <option *ngFor="let role of roles" [value]="role">{{ role | titlecase }}</option>
        </select>
      </div>

      <div class="field">
        <label for="userId">User ID</label>
        <select id="userId" formControlName="userId" autocomplete="username">
          <option value="" disabled>Select your user ID</option>
          <option *ngFor="let userId of userIds" [value]="userId">{{ userId }}</option>
        </select>
        <span class="error" *ngIf="attempted && loginForm.controls.userId.hasError('required')">User ID is required.</span>
      </div>

      <p class="login-error" *ngIf="attempted && loginForm.invalid" role="alert">Enter a user ID to continue.</p>
      <button class="btn btn-primary login-button" type="submit">Continue to Audit Search</button>
    </form>
  </section>
</main>
