<section class="card search-card">
  <div class="card-header">
    <div>
      <h2>Audit Search Criteria</h2>
      <p>Enter one or more criteria to search audit records.</p>
    </div>
    <span class="required-note"><span>*</span> Required fields</span>
  </div>

  <form [formGroup]="searchForm" (ngSubmit)="searchRequested.emit()" novalidate>
    <div class="form-grid">
      <div class="field">
        <label for="startDate">Start date <span>*</span></label>
        <input id="startDate" type="date" formControlName="startDate">
      </div>

      <div class="field">
        <label for="endDate">End date <span>*</span></label>
        <input id="endDate" type="date" formControlName="endDate">
        <small class="error" *ngIf="searchForm.get('endDate')?.hasError('range')">
          End date must be on or after start date.
        </small>
      </div>

      <div class="field field-wide">
        <label for="applicationName">Application name <span>*</span></label>
        <input id="applicationName" type="text" formControlName="applicationName">
      </div>

      <div class="field field-wide">
        <label for="userName">User name</label>
        <input id="userName" type="text" formControlName="userName" placeholder="Last name, First name">
      </div>

      <fieldset class="field-group">
        <legend>Event type</legend>
        <div class="check-row">
          <label class="check-item" *ngFor="let type of eventTypes">
            <input type="checkbox" [checked]="isMultiValueSelected('eventTypes', type)" (change)="toggleMultiValue('eventTypes', type)">
            <span>{{ type }}</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="field-group">
        <legend>Event status</legend>
        <div class="check-row">
          <label class="check-item" *ngFor="let status of eventStatuses">
            <input type="checkbox" [checked]="isMultiValueSelected('eventStatuses', status)" (change)="toggleMultiValue('eventStatuses', status)">
            <span>{{ status }}</span>
          </label>
        </div>
      </fieldset>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="resetRequested.emit()">Reset</button>
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        <span class="button-spinner" *ngIf="loading"></span>
        {{ loading ? 'Searching...' : 'Search audit records' }}
      </button>
    </div>
  </form>
</section>
